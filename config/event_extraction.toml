# Configuration for event extraction pipeline

[paths]
data_root = "data/cases"
# Pipeline-generated artifacts (events/, stages/) are written here instead of
# under data_root, so an iteration's output can be wiped with e.g.
# `rm -rf data/extraction/case_95` without touching source case data.
output_root = "data/extraction"
events_dir = "events"

[stage_1]
# Extract metadata from database
extract_from_database = true

# Extract metadata from PDF files
extract_from_pdfs = true

# Extract metadata from Docling parsed files
extract_from_docling = true

# Extract filer/assigned-judge/timestamp/court-clerk metadata from each
# document's matching e-filing confirmation notice under confirmations/. The
# document itself (documents/) remains the sole source for entity detection
# in Stage 2.
extract_from_confirmations = true

# Sanity-check the regex-discovered actor roster with an LLM before writing
# actors.json - corrects mis-assigned roles, drops obvious junk (e.g. a
# stray address line), and phrases the GLiNER labels. Falls back to the
# unvalidated, deterministically-labeled roster if the backend server isn't
# reachable, so this is safe to leave on.
validate_actors_with_llm = true

# "ollama" (default, verified against this repo's local Ollama server) or
# "nuextract" (this repo's existing vLLM-served NuExtract client - see
# lawsuit_parser.event_extraction.nuextract_client). Switching backend means
# also swapping llm_model/llm_base_url below to the matching pair:
#   ollama:    llm_model = "qwen3:30b-a3b"      llm_base_url = "http://localhost:11434"
#   nuextract: llm_model = "numind/NuExtract3"  llm_base_url = "http://localhost:8000/v1"
# To swap to a different Ollama model, just change llm_model to any tag
# already pulled locally (`ollama pull <tag>`) - no code changes needed.
llm_backend = "ollama"
llm_model = "qwen3:30b-a3b"
llm_base_url = "http://localhost:11434"

# Identify the medical substance/drug/medical device/cosmetic product the
# plaintiff accuses of causing harm, and the defendant(s) it's attributed
# to, via the same llm_backend above (there's no fixed textual format to
# regex an arbitrary product name from, unlike a caption or citation - this
# is a reading-comprehension task). Written to products.json and merged
# into gliner_config.json's dynamic labels alongside actors.json.
extract_products = true

# Regex patterns for date extraction
date_patterns = [
    # MM/DD/YYYY or M/D/YYYY
    "\\d{1,2}/\\d{1,2}/\\d{4}",
    # YYYY-MM-DD
    "\\d{4}-\\d{2}-\\d{2}",
    # Month DD, YYYY (e.g., January 15, 2024)
    "(?:January|February|March|April|May|June|July|August|September|October|November|December)\\s+\\d{1,2},\\s+\\d{4}",
    # Mon DD, YYYY (e.g., Jan 15, 2024)
    "(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\\.?\\s+\\d{1,2},\\s+\\d{4}",
]

[stage_2]
# GLiNER model to use
model = "urchade/gliner_multi-v2.1"

# Confidence threshold for entity detection (0.0-1.0)
threshold = 0.5

# Batch size for GLiNER processing
batch_size = 8

# Use GPU if available
use_gpu = true

# Minimum full sentences of context captured before/after each detected
# entity (fewer only at a document boundary). Sentence-anchored rather than
# a fixed character window, so context isn't cut off mid-sentence.
context_sentences_before = 2
context_sentences_after = 2

# After GLiNER runs, regex-search each named actor's canonical name/aliases
# (from actors.json) over the document text and add any exact-match spans
# GLiNER's threshold missed - a deterministic recall backstop for known
# parties. Complements GLiNER rather than replacing it: GLiNER is still the
# only source for generic/unnamed labels (temporal expression, monetary
# amount, witness) that have no fixed string to search for.
enable_gazetteer = true

# Skip actor names/aliases shorter than this many characters, to cut noise
# from short acronyms/initials colliding with unrelated text.
gazetteer_min_term_length = 3

# Static entity labels (general entity types)
static_labels = [
    "temporal expression",
    "legal action or event",
    "court",
    "geographic location",
    "monetary amount",
    "document reference",
    "case citation",
    "medical substance, drug, medical device, or cosmetic product",
]

# Dynamic labels will be generated automatically based on discovered parties
# from Stage 1 (e.g., "plaintiff (Jane Doe)", "defendant (ACME Inc.)")

[stage_3]
# Generate a 1-3 sentence summary of each document's core purpose (why it
# was filed/created, what it accomplishes) via an LLM. Falls back to no
# summary for a document if the backend server isn't reachable, so this is
# safe to leave on.
summarize_documents = true

# Same backend options as [stage_1] above.
llm_backend = "ollama"
llm_model = "qwen3:30b-a3b"
llm_base_url = "http://localhost:11434"

# Maximum characters of document text sent to the LLM - larger than Stage
# 1's title excerpt, since a document's core purpose often isn't stated on
# page 1 alone (e.g. a complaint's factual background, a motion's argument).
max_chars = 8000

# Stage 4 (date clustering - parsing + same-paragraph grouping + candidate
# actors from entities.json) has no settings of its own yet.

[stage_5]
# Synthesize an Event (what happened, outcome, who was involved) for each
# Stage 4 date cluster via an LLM. Falls back to no events for a cluster if
# the backend server isn't reachable, so this is safe to leave on.
synthesize_events = true

# Same backend options as [stage_1] above.
llm_backend = "ollama"
llm_model = "qwen3:30b-a3b"
llm_base_url = "http://localhost:11434"
