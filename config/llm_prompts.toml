# Prompt wording for lawsuit_parser.event_extraction.llm_validation's
# Ollama/NuExtract-backed calls. Templates are plain Python str.format()
# strings - {placeholder} tokens are filled in by
# lawsuit_parser.event_extraction.prompts, which also decides which of a
# task's optional *_line templates actually get included (e.g. a
# text_excerpt_line is only rendered when an excerpt was passed in).
#
# Edit wording here without touching code. Adding a new {placeholder} to a
# template requires passing the matching keyword from prompts.py's
# build_*_prompt function.

[actor_validation]
template = """
You are validating a roster of people/roles extracted by regex from a lawsuit's court filings (case captions and e-filing confirmation notices).
Case caption: {caption}
Court: {court}

For each candidate below, confirm or correct its role from this set: {valid_roles}.
Set keep=false if the entry is clearly not a real person/organization name: a stray street address, page furniture, OCR garbage, or a single generic word/phrase that reads like a document title rather than a party (e.g. 'STIPULATION', 'ORDER', 'NOTICE', 'AFFIDAVIT') - court filings often place these right next to the party list.
Propose a short GLiNER detection label: for a named actor use '<role> (<name>)' (e.g. 'plaintiff (Jane Doe)'); for a generic/unnamed placeholder use the bare role (e.g. 'witness').
Return exactly one output entry per candidate, in the same order given.

Candidates:
{candidates}
"""

[product_identification]
intro = """
You are identifying the medical substance, drug, medical device, or cosmetic product that the plaintiff in this lawsuit accuses of causing harm, and the defendant(s) it is attributed to (its manufacturer, seller, or distributor).
Case caption: {caption}
Court: {court}
Case type: {case_type}
"""
litigation_caption_line = "Coordinated-litigation captions found in this case's filings name the product directly: {candidates}"
defendants_line = "Known defendants in this case - attribute the product to one or more of these by exact name where you can tell: {names}"
text_sample_line = "Excerpt from a filing in this case, for context:\n{text_sample}"
closing = """
Return one entry per distinct accused product. If the pleading treats several defendants' branded products as one legally defined category (e.g. "the Cosmetic Products" or "the PRODUCTS"), name that category, not each individual brand. Return an empty products list if no product/substance is clearly the subject of the plaintiff's harm allegations - do not guess.
"""

[title_identification]
intro = """
You are identifying the formal name/type of a single legal document from its first page (e.g. "Summons", "Verified Complaint", "Notice of Motion", "Stipulation of Discontinuance", "Affidavit of Service", "Memorandum of Law in Support").
"""
docling_title_line = "A layout-detection pass found this as a likely title: {docling_title}"
candidates_line = "Short, mostly-uppercase lines found on page 1 that may name the document (not necessarily the title - could be a party name or boilerplate): {candidates}"
text_excerpt_line = "First-page text, for context:\n{text_excerpt}"
closing = """
Return the single best short title for this document, in normal title case (not all-caps) even if the source text is all-caps. Return an empty string if the text doesn't clearly name a specific document type - do not guess or invent one.
"""

[summary]
intro = """
You are summarizing a single legal document in 5-20 sentences. Focus on the document's core purpose: why it was filed or created, and what it accomplishes (e.g. who is asking a court for what, who is notifying whom of what, what fact or event it records) - not a restatement of its contents or boilerplate caption/header text. Use bullet points if needed to underline the events timeline or enumerate event that happened.
"""
title_line = "This document's identified title/type: {document_title}"
text_excerpt_line = "Document text, for context:\n{text_excerpt}"
closing = """
Return a 1-3 sentence summary. Return an empty string if the text doesn't give you enough to summarize - do not guess or invent one.
"""

[event_synthesis]
intro = """
You are analyzing one passage from a legal filing to identify what actually happened on the specific date(s) found in it, for building a case timeline/graph.
"""
title_line = "This document's identified title/type: {document_title}"
summary_line = "This document's overall purpose: {document_summary}"
dates_line = "Date(s) found in this passage: {dates}"
actors_line = "People, organizations, and products already identified near this passage - name only people/organizations/products from this exact list as involved, never one you don't see here: {candidate_actors}"
no_actors_line = "No specific people, organizations, or products were identified near this passage - do not name anyone as involved."
passage_line = "Passage text (each date is marked with ** ):\n{citation}"
closing = """
For each date above that corresponds to an actual event in this case's own history - not a citation to unrelated case law, a form's boilerplate date range, or garbled OCR text - return one event: a short event_type (e.g. "filing", "hearing", "service of process", "deposition", "order issued", "settlement"), a 1-2 sentence description of what happened, the outcome if the passage states one (omit it otherwise), which of the listed people/organizations/products were involved, and which of the listed dates it corresponds to (a single event can cover more than one date if the passage describes them together). Assign a confidence from 0 to 1. Return an empty events list if none of the dates correspond to an identifiable case event.
"""
