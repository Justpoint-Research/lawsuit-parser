[project]
name = "lawsuit-parser"
version = "0.1.0"
description = "A tool for parsing and analyzing legal documents"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.3",
    "pyarrow>=19.0.0",
    "ipykernel>=7.2.0",
    "click>=8.1.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.9",
    "pandas-stubs~=3.0.3",
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.0.0",
    "notebook>=7.6.0",
    "requests>=2.32.0",
    "lxml>=5.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "cloud-sql-python-connector[pg8000]>=1.15.0",
    "streamlit>=1.40.0",
    "google-cloud-storage>=2.0.0",
    "docling>=2.0.0",
    "docling-core>=2.0.0",
    "tqdm>=4.66.0",
    "pydantic>=2.0",
    "gliner>=0.2.0",
    "openai>=1.0.0",
    "rapidfuzz>=3.0.0",
    "tomli-w>=1.0.0",
    "maverick-coref>=1.0.7",
    "tomli>=2.4.1",
    # Pin torch to the newest CUDA 12.4 build (the cu124 wheel index tops out
    # at 2.6.0). transformers>=5 refuses torch.load on non-safetensors
    # checkpoints (e.g. Maverick's deberta-v3-large encoder) below torch 2.6.
    "torch>=2.6.0,<2.7.0",
    # Allow latest transformers with rt_detr_v2 support and torch import fix
    "transformers>=5.0.0",
    # GPU-enabled onnxruntime for docling's ONNX layout/OCR engines. Shares
    # the `onnxruntime` import path with the CPU-only `onnxruntime` package,
    # which gliner unconditionally depends on; the override below prevents
    # that plain CPU package from being installed and clobbering this one.
    "onnxruntime-gpu[cuda,cudnn]>=1.20.0,<1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
override-dependencies = [
    # Never satisfy plain `onnxruntime` (CPU-only) requirements from
    # transitive deps (gliner) - `onnxruntime-gpu` provides the same
    # `onnxruntime` import path with CUDA support.
    "onnxruntime; python_version < '0'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
]

[tool.setuptools.packages.find]
include = ["lawsuit_parser*"]
